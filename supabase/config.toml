# Supabase CLI settings for project "jawla" (ref mqpzimmvnnzcoyfuqnbe).
project_id = "jawla"

# These two are called without a Supabase user token, so JWT checking is off.
# They check everything themselves (MyFatoorah re-check, webhook signature).
[functions.payment-return]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

# Live settings (checked 2026-11-17): these two check the user token inside the code.
[functions.create-payment]
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

[functions.refill-questions]
verify_jwt = false

[functions.seed-pictures]
verify_jwt = false
